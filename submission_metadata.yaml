ai_usage_summary: |
  Used Claude for architectural review and component design discussion.
  All scoring logic, weights, and candidate evaluation heuristics were
  engineered from first-principles analysis of the JD and signals doc.
  No candidate data was fed to any LLM during ranking.

methodology_summary: |
  5-component weighted scoring: TF-IDF cosine skill match (35%), career
  trajectory scoring (30%), non-linear experience curve targeting 5-9yr
  sweet spot (15%), behavioral availability composite from 6 Redrob signals
  (15%), education/extras (5%). Hard filters for pure IT-services backgrounds
  and non-technical current titles prevent keyword stuffers from ranking.
  Honeypot detection excludes 22 impossible profiles. All scoring runs on
  pre-vectorized sparse matrices — 100K candidates in ~80s, CPU only,
  no network calls.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
